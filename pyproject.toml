[build-system]
requires = ["setuptools>=61.0", 'toml']
build-backend = "setuptools.build_meta"

[project]
name = "tools4vasp"
dependencies = [
  'ase >= 1.0',
  'matplotlib >= 3.8.4',
  'natsort >= 8.3.1',
  'numpy >= 1.24.3',
  'pymatgen >= 2023.5.10',
  'scipy >= 1.10.0',
]
version = "1.4.0"
authors = [
  { name="Patrick Melix", email="patrick.melix@uni-leipzig.de" },
]
description = "Python tools for VASP"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Unix Shell",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/Tonner-Zech-Group/VASP-tools"
Issues = "https://github.com/Tonner-Zech-Group/VASP-tools/issues"



[project.scripts]
add-MODECAR = "tools4vasp.add_MODECAR:main"
chgcar2cube = "tools4vasp.chgcar2cube:main"
mixed_interpolate = "tools4vasp.mixed_interpolate:main"
calc-deformation-density = "tools4vasp.calc_deformation_density:main"
elf2cube = "tools4vasp.elf2cube:main"
getPOTCAR = "tools4vasp.getPOTCAR:main"
freq2jmol = "tools4vasp.freq2jmol:main"
freq2mode = "tools4vasp.freq2mode:main"
kgrid2kspacing = "tools4vasp.kgrid2kspacing:main"
kspacing2kgrid = "tools4vasp.kspacing2kgrid:main"
plot_neb_movie = "tools4vasp.plot_neb_movie:main"
neb2movie = "tools4vasp.neb2movie:main"
plotIRC = "tools4vasp.plotIRC:main"
plotHOMA_withPBC = "tools4vasp.plotHOMA_withPBC:main"
plotNEB = "tools4vasp.plotNEB:main"
poscar2nbands = "tools4vasp.poscar2nbands:main"
replace_potcar_symlinks = "tools4vasp.replace_potcar_symlinks:main"
set_vacuum = "tools4vasp.set_vacuum:main"
split_surf_and_mol = "tools4vasp.split_surf_and_mol:main"
split_vasp_freq = "tools4vasp.split_vasp_freq:main"
vasp2traj = "tools4vasp.vasp2traj:main"
vaspcheck = "tools4vasp.vaspcheck:main"
vasplint = "tools4vasp.vasplint:main"
vaspcheck-outcar = "tools4vasp.outcar_convergence:main"
vaspGetEF = "tools4vasp.vaspGetEF:main"
viewMode = "tools4vasp.viewMode:main"
visualize-magnetization = "tools4vasp.visualize_magnetization:main"
xyz2POSCAR = "tools4vasp.xyz2POSCAR:main"


[tool.setuptools]
packages = ["tools4vasp",'tools4vasp.bash_scripts']
package-dir = {'' = 'src'}

# Without this the wheel ships bash_scripts/__init__.py and nothing else, so
# every console script that shells out to a .sh file (getPOTCAR,
# replace_potcar_symlinks, calc-deformation-density, plot_neb_movie) and
# vaspsetup.build_potcar_from_pp_path() are broken for a pip install.
[tool.setuptools.package-data]
"tools4vasp.bash_scripts" = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v"

[tool.ruff.lint.per-file-ignores]
# Module names mirror the published CLI entry points in [project.scripts]
# above (e.g. tools4vasp.add_MODECAR:main) - renaming them is a breaking
# change for this PyPI package, so N999 is ignored here rather than fixed.
"src/tools4vasp/add_MODECAR.py" = ["N999"]
"src/tools4vasp/getPOTCAR.py" = ["N999"]
"src/tools4vasp/plotHOMA_withPBC.py" = ["N999"]
"src/tools4vasp/plotIRC.py" = ["N999"]
"src/tools4vasp/plotNEB.py" = ["N999"]
"src/tools4vasp/vaspGetEF.py" = ["N999"]
"src/tools4vasp/viewMode.py" = ["N999"]
"src/tools4vasp/xyz2POSCAR.py" = ["N999"]
